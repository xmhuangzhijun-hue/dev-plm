frontend:
  applicable: true
  language: JavaScript / HTML / CSS
  framework: 原生网页（示例）
  version: ES2022；静态文件服务使用 Python 3.12
  install: 无第三方依赖
  start: python -m http.server 5173 --directory frontend
  port: 5173
backend:
  applicable: true
  language: Python
  framework: 标准库 HTTP 服务（示例，代码未提供）
  version: '3.12'
  install: 无第三方依赖
  start: python -m qingdan_service
  port: 8080
database:
  engine: SQLite 3（Python 标准库 sqlite3）
  start: 无独立进程；示例后端按 DATABASE_PATH 打开数据库
  migrate: python -m qingdan_service.migrate
configuration:
- name: DATABASE_PATH
  purpose: 本地任务数据库位置
  source: 找后端负责人（示例）领取本地配置说明
- name: SESSION_SIGNING_KEY
  purpose: 签发和验证短期访问令牌
  source: 本机私有凭据登记（公开版省略编号）
- name: DEMO_LOGIN_PASSWORD
  purpose: 示例调用方的登录凭据
  source: 本机私有凭据登记（公开版省略编号）
environments:
- id: development
  label: 开发
  server_ref: development
- id: testing
  label: 测试
  server_ref: testing
- id: production
  label: 生产
  server_ref: production
owners:
- name: 产品负责人（示例）
  scope: 范围、用户原话、验收条件和毛坯确认
- name: 前端负责人（示例）
  scope: 页面展示、可访问性、输入与 API 对接
- name: 后端负责人（示例）
  scope: 身份、任务归属、API、迁移和配置登记
