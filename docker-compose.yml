name: devplm-local
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${DEVPLM_DB_ADMIN_USER:-postgres}
      POSTGRES_DB: ${DEVPLM_DB_NAME:-devplm}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${DEVPLM_DB_PORT:-55432}:5432"
    volumes:
      - type: bind
        source: ${DEVPLM_PG_DATA:?Set dedicated D-drive data directory in .env}
        target: /var/lib/postgresql/data
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
secrets:
  postgres_password:
    file: ${DEVPLM_POSTGRES_PASSWORD_FILE:?Set registered credential file path in .env}
